<ion-app class="mobile-app-root">
  <div class="mobile-frame-container">
    
    <!-- Side Menu แบบ Overlay สไตล์ Mobile Drawer -->
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <div class="menu-top-header">
          <div class="menu-brand-row">
            <span class="menu-app-icon">🎯</span>
            <div>
              <h2 class="menu-title">Decidr</h2>
              <p class="menu-subtitle">แอปช่วยตัดสินใจชีวิต & AI Judge</p>
            </div>
          </div>
          <div class="menu-user-status">
            @if (currentUser) {
              <span>👤 ผู้ใช้: <strong>{{ currentUser.username }}</strong></span>
            } @else {
              <span>👤 โหมดทดลองเล่น (Guest Mode)</span>
            }
          </div>
        </div>

        <ion-list lines="none" class="menu-nav-list">
          <ion-list-header>เมนูใช้งาน</ion-list-header>
          @for (p of appPages; track p.url) {
            <ion-menu-toggle auto-hide="true">
              <ion-item routerDirection="root" [routerLink]="[p.url]" detail="false" routerLinkActive="selected" class="menu-item-link">
                <ion-icon aria-hidden="true" slot="start" [name]="p.icon + '-outline'"></ion-icon>
                <ion-label>{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>

        @if (currentUser) {
          <div style="padding: 16px;">
            <ion-button expand="block" color="danger" fill="outline" size="small" shape="round" (click)="logout()">
              <ion-icon slot="start" name="log-out-outline"></ion-icon>
              ออกจากระบบ
            </ion-button>
          </div>
        }
      </ion-content>
    </ion-menu>

    <!-- Main Content Area พร้อม Bottom Tab Bar -->
    <div class="main-viewport-wrapper" id="main-content">
      <div class="page-content-scroll">
        <ion-router-outlet></ion-router-outlet>
      </div>

      <!-- แถบเมนูด้านล่างสุด (Native Mobile Bottom Tab Bar) -->
      <nav class="native-bottom-tab-bar">
        @for (p of appPages; track p.url) {
          <a [routerLink]="[p.url]" routerLinkActive="tab-active" class="bottom-tab-button">
            <ion-icon [name]="p.icon + '-outline'" class="tab-icon"></ion-icon>
            <span class="tab-label">{{ p.shortTitle }}</span>
          </a>
        }
      </nav>
    </div>

  </div>
</ion-app>
